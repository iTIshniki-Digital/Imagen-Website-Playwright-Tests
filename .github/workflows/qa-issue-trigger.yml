name: QA Dashboard — start run from issue
on:
  # Дашборд ("Imagen QA Runs", claude.ai Artifact) открывает issue с
  # телом, содержащим блок ```qa-run {...}``` — см.
  # .github/scripts/handle-qa-run-issue.js и scripts/README-qa-dashboard.md.
  # Обычные issues (без этого блока) просто игнорируются — см. скрипт.
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
  # Нужно, чтобы этим же токеном запустить playwright.yml (workflow_dispatch
  # в том же репозитории) — без этого gh workflow run падает с 403.
  actions: write
jobs:
  dispatch:
    # github.event.issue.pull_request существует только когда "issue" на
    # самом деле PR (GitHub шлёт PR-события тоже через issues API) — такие
    # пропускаем, это не наш случай.
    # Плюс: только issues из формы QA-прогона (в теле есть "### Browsers") —
    # иначе на каждый автоматически заведённый qa-bug поднималась машина
    # впустую (6 лишних запусков в Actions за один прогон, 2026-10-28).
    if: ${{ !github.event.issue.pull_request && contains(github.event.issue.body, '### Browsers') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse qa-run block and dispatch the test run
        env:
          # QA_BOT_TOKEN — personal access token (repo scope), used because
          # this org/repo's "Workflow permissions" is locked to read-only
          # and neither an org owner nor a repo admin has flipped it (see
          # scripts/README-qa-dashboard.md). A PAT isn't capped by that
          # setting at all, so it works regardless. Falls back to the
          # built-in token if QA_BOT_TOKEN is ever removed — works too,
          # once/if that setting is eventually switched to read-and-write.
          GH_TOKEN: ${{ secrets.QA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/handle-qa-run-issue.js
