name: Playwright Tests
on:
  # Только вручную — по требованию 2026-09-24: раньше тут были push/PR/
  # schedule (3 раза в день), но авто-прогоны заливали отчёты на GitHub
  # без участия пользователя и забивали лимит хранилища артефактов.
  # inputs ниже доступны и в форме "Run workflow" на GitHub, и через
  # GitHub API (POST .../actions/workflows/playwright.yml/dispatches) —
  # тем же способом работает форма на сайте (wordpress-plugin/).
  #
  # Важно: если появляется новый input, сначала пушим этот файл, и только потом
  # обновляем плагин. GitHub отвечает 422 на неизвестные inputs.
  workflow_dispatch:
    inputs:
      browsers:
        description: 'Browsers, comma-separated: chromium, firefox, webkit'
        required: false
        default: 'chromium'
      raw_client_cookies:
        description: 'Cookie string for the A/B variant: "name1=value1; name2=value2"'
        required: false
        default: ''
      spec_files:
        description: 'Specific spec files separated by spaces (empty = full suite), e.g. tests/homepage.spec.ts'
        required: false
        default: ''
      grep:
        description: 'Test name filter (empty = no filter). Latin letters, digits, spaces and _ . , : ( ) / | - only'
        required: false
        default: ''
      retries:
        description: 'Retry failed tests once: true or false'
        required: false
        default: 'false'
      source_issue:
        description: 'Internal: issue number that requested this run (via the QA dashboard), empty for a manual run'
        required: false
        default: ''
permissions:
  contents: read
  # Публикация итогов/багов обратно в Issues — см. шаг "Sync QA bugs to
  # GitHub Issues" и .github/workflows/qa-issue-trigger.yml.
  issues: write
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        E2E_BYPASS_TOKEN: ${{ secrets.E2E_BYPASS_TOKEN }}
        RAW_CLIENT_COOKIES: ${{ inputs.raw_client_cookies }}
        BROWSERS: ${{ inputs.browsers }}
        SPEC_FILES: ${{ inputs.spec_files }}
        GREP: ${{ inputs.grep }}
        RETRIES: ${{ inputs.retries }}
      # Значения из inputs идут через env, а не через ${{ }} прямо в скрипт —
      # содержимое полей не может подменить команду. Каждое значение дополнительно
      # проверяется здесь по белому списку: форма на сайте уже проверяет его, но
      # прогон можно запустить и вручную, поэтому защита стоит и тут.
      run: |
        set -euo pipefail
        args=()

        IFS=',' read -ra BROWSER_LIST <<< "$BROWSERS"
        for raw in "${BROWSER_LIST[@]}"; do
          b="$(echo "$raw" | xargs)"
          case "$b" in
            chromium|firefox|webkit) args+=("--project=$b") ;;
            *) echo "Invalid browser: '$b'" >&2; exit 1 ;;
          esac
        done

        if [ -n "$SPEC_FILES" ]; then
          read -ra SPECS <<< "$SPEC_FILES"
          for f in "${SPECS[@]}"; do
            if [[ ! "$f" =~ ^tests/[A-Za-z0-9._-]+\.spec\.ts$ ]]; then
              echo "Invalid test file: '$f'" >&2
              exit 1
            fi
          done
          args+=("${SPECS[@]}")
        fi

        if [ -n "$GREP" ]; then
          grep_re='^[A-Za-z0-9 _.,:()/|-]{1,120}$'
          if [[ ! "$GREP" =~ $grep_re ]]; then
            echo "Invalid name filter" >&2
            exit 1
          fi
          args+=("--grep" "$GREP")
        fi

        if [ "$RETRIES" = "true" ]; then
          args+=("--retries=1")
        fi

        echo "npx playwright test ${args[*]}"
        npx playwright test "${args[@]}"
    - name: Zip report
      if: ${{ !cancelled() }}
      run: zip -r playwright-report.zip playwright-report/
    - name: Upload report to Google Drive
      # Отчёты больше не хранятся в GitHub Actions artifacts (там была
      # квота 500МБ, см. историю retention-days) — вместо этого улетают
      # в Google Drive, скрипт сам чистит там всё старше 7 дней.
      if: ${{ !cancelled() }}
      run: node scripts/upload-report-to-drive.js
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
    - name: Publish run (Drive + GitHub Issues)
      # Один проход (scripts/publish-qa-dashboard-run.js): разбирает
      # playwright-report/results.json по категориям клиентского чек-листа,
      # грузит скриншоты/видео упавших проверок на Google Drive один раз —
      # и использует те же ссылки и в latest.json (его читает веб-приложение,
      # docs/), и в issues с лейблом qa-bug. Раньше это были два отдельных
      # шага/скрипта с раздельным парсингом — issues никогда не получали
      # скриншот, потому что скрипт, который их заводил, сам на Drive ничего
      # не грузил (найдено 2026-10-19 на живом прогоне). Теперь один объект
      # run проходит через обе публикации внутри одного процесса.
      # continue-on-error: сбой здесь не должен красить весь прогон тестов,
      # отчёт на Drive к этому шагу уже загружен предыдущим шагом.
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: node scripts/publish-qa-dashboard-run.js
      env:
        GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
        GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        GDRIVE_LATEST_JSON_FILE_ID: ${{ secrets.GDRIVE_LATEST_JSON_FILE_ID }}
        GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        BROWSERS: ${{ inputs.browsers }}
        SPEC_FILES: ${{ inputs.spec_files }}
        GREP: ${{ inputs.grep }}
        RETRIES: ${{ inputs.retries }}
        # QA_BOT_TOKEN — см. тот же комментарий в qa-issue-trigger.yml:
        # "Workflow permissions" у этого репозитория read-only и пока
        # некому его переключить, PAT этим не ограничен. Фолбэк на
        # встроенный токен, если секрет когда-нибудь уберут.
        GH_TOKEN: ${{ secrets.QA_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        SOURCE_ISSUE: ${{ inputs.source_issue }}
