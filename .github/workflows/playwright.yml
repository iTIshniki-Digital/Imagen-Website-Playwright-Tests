name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # Время в UTC. 3 раза в день: 06:00, 14:00, 22:00 UTC.
    # Возвращено 2026-09-16: подтверждено живым прогоном (run 35088163436),
    # что Cloudflare bypass (E2E_BYPASS_TOKEN) работает и CI больше не
    # ловит 403 — прогон занимает штатные ~9 минут, падают только 2
    # известных реальных бага сайта, а не инфраструктура.
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
    - cron: '0 22 * * *'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        E2E_BYPASS_TOKEN: ${{ secrets.E2E_BYPASS_TOKEN }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
