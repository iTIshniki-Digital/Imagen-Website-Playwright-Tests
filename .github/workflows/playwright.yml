name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  # ВРЕМЕННО ОТКЛЮЧЕНО (2026-09-15): реальный прогон в CI показал, что
  # Cloudflare на стороне клиента блокирует (403) большинство запросов с IP
  # раннеров GitHub Actions — прогон гарантированно красный не из-за багов
  # сайта. Ждём от клиента allowlist/bypass для QA-трафика, после чего
  # раскомментировать schedule ниже.
  # schedule:
  #   # Время в UTC. 3 раза в день: 06:00, 14:00, 22:00 UTC.
  #   - cron: '0 6 * * *'
  #   - cron: '0 14 * * *'
  #   - cron: '0 22 * * *'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
